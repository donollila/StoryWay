<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StoryWay">
<meta name="theme-color" content="#E8F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A26" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>StoryWay Kids</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow storybook column; cover → story pages → checkpoint recap → ending */
:root{
  --bg:#E8F2EF; --card:#FFFFFF; --ink:#1E2A3A; --muted:#5A6878;
  --accent:#6A3FA0; --accent-soft:#EFE7FA; --sun:#E9A72E; --line:#D3E2DD;
  --good:#2E8B5A; --bad:#B4483B; --hl:#FBE3A6;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131A26; --card:#1D2637; --ink:#EDF1F7; --muted:#A0ACBC;
  --accent:#B89BF0; --accent-soft:#2A2343; --sun:#F3C25A; --line:#2C3649;
  --good:#5CC48D; --bad:#E7887B; --hl:#5A4615; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131A26; --card:#1D2637; --ink:#EDF1F7; --muted:#A0ACBC;
  --accent:#B89BF0; --accent-soft:#2A2343; --sun:#F3C25A; --line:#2C3649;
  --good:#5CC48D; --bad:#E7887B; --hl:#5A4615; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,label{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{transform:scale(.98)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.6rem;font-weight:800;letter-spacing:-.01em}
h1 span{color:var(--accent)}
h2{font-size:1.7rem;font-weight:800}
h3{font-size:1.2rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:52ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input{font:inherit;font-size:max(16px,1.1rem);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.stories{display:grid;gap:14px}
.story-pick{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;transition:transform .15s,border-color .15s}
.story-pick:hover{border-color:var(--accent);transform:translateY(-2px)}
.story-pick svg{width:72px;height:72px}
.story-pick div{display:flex;flex-direction:column;gap:4px;min-width:0}
.story-pick small{color:var(--muted);font-weight:600}
.soon{font-size:.9rem;color:var(--muted);text-align:center}
/* story page */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0}
.chap{font-family:var(--display);font-weight:600;color:var(--accent)}
.player{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:999px;padding:8px 16px 8px 8px}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--card);display:grid;place-items:center;flex:none}
.play svg{width:22px;height:22px}
.wave{display:flex;gap:4px;align-items:center;height:26px;flex:1}
.wave i{display:block;width:5px;height:6px;border-radius:3px;background:var(--accent);opacity:.45}
.speaking .wave i{animation:bob 1s ease-in-out infinite;opacity:.9}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}.wave i:nth-child(7){animation-delay:.6s}
@keyframes bob{50%{height:24px}}
.auto{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.auto input{width:18px;height:18px;accent-color:var(--accent)}
.text{font-size:1.2rem;line-height:1.65;display:flex;flex-direction:column;gap:14px}
.text p.say{border-left:4px solid var(--sun);padding-left:12px;font-style:italic}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:700;font-size:1.05rem}
.choice:hover{border-color:var(--accent)}
.choice b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display)}
.primary{background:var(--accent);color:var(--card);border:0;border-radius:16px;padding:14px 20px;font-weight:800;font-size:1.1rem}
/* recap */
.badge{display:inline-block;background:var(--sun);color:#1E2A3A;font-family:var(--display);font-weight:800;padding:4px 14px;border-radius:999px;font-size:1rem}
.traits{display:grid;gap:10px}
.trait{display:grid;grid-template-columns:96px 1fr 26px;gap:10px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .6s}
.log{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.log li strong{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-family:var(--display);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.note{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


/* favorite animal */
.prefs{display:flex;flex-direction:column;gap:16px}
.flabel{font-weight:700}
.pets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pet{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:8px 4px;font-weight:700;font-size:.9rem}
.pet svg{width:52px;height:52px}
.pet.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
/* faces */
.faces{display:flex;gap:14px;flex-wrap:wrap}
.face{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:96px}
.face svg{width:84px;height:84px;background:var(--accent-soft);border-radius:50%}
.face figcaption{font-size:.8rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.face.big{width:120px}.face.big svg{width:112px;height:112px}
.with-face{display:flex;gap:14px;align-items:flex-start}
.with-face>div{flex:1;min-width:0}
.feel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.feel .row{display:flex;gap:16px;align-items:center}
.feel .q{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.2}
.feel .opts{display:flex;gap:8px;flex-wrap:wrap}
.feel .opts button{background:var(--accent-soft);color:var(--accent);border:2px solid transparent;border-radius:999px;padding:10px 18px;font-weight:800;font-size:1rem}
.feel .opts button.right{background:var(--good);color:var(--card)}
.feel .opts button.wrong{border-color:var(--bad);color:var(--bad);background:var(--card)}
.feel .why{font-size:1.1rem;line-height:1.6}
@media (max-width:420px){.with-face{flex-direction:column}.with-face .face{align-self:center}}
/* lessons + store */
.moment{display:flex;flex-direction:column;gap:16px}
.lesson{background:var(--accent-soft);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.lesson .tag{align-self:flex-start;background:var(--accent);color:var(--card);font-family:var(--display);font-weight:800;padding:2px 14px;border-radius:999px;font-size:1.05rem}
.lesson p{font-size:1.15rem;line-height:1.6}
.oops{background:var(--card);border:2px dashed var(--bad);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.oops .tag{align-self:flex-start;color:var(--bad);font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.oops p{font-size:1.15rem;line-height:1.6}
.retry{background:var(--card);color:var(--accent);border:2px solid var(--accent);border-radius:16px;padding:14px 20px;font-weight:800;font-size:1.1rem}
.btns{display:flex;flex-direction:column;gap:10px}
.story-pick.locked{border-style:dashed}
.story-pick .price{align-self:flex-start;margin-top:4px;background:var(--sun);color:#1E2A3A;font-weight:800;font-size:.85rem;padding:2px 10px;border-radius:999px}
.store{background:var(--card);border:2px solid var(--sun);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.learned{display:flex;flex-direction:column;gap:10px}
.learned li{line-height:1.5}
.talk{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.talk ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.s{border-radius:6px;cursor:pointer;transition:background-color .2s,box-shadow .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s.reading{background:var(--hl);box-shadow:0 0 0 3px var(--hl)}
[data-q].reading:not(.s){outline:3px solid var(--sun);outline-offset:3px}
.loading{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const ICONS={
 detective:`<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--accent-soft)"/><circle cx="31" cy="31" r="13" fill="none" stroke="var(--accent)" stroke-width="5"/><line x1="40" y1="40" x2="54" y2="54" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/><circle cx="27" cy="27" r="3" fill="var(--sun)"/></svg>`,
 athlete:`<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--accent-soft)"/><circle cx="36" cy="36" r="18" fill="var(--card)" stroke="var(--accent)" stroke-width="4"/><polygon points="36,28 43,33 40,41 32,41 29,33" fill="var(--accent)"/><circle cx="56" cy="16" r="4" fill="var(--sun)"/></svg>`,
 puppy:`<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--accent-soft)"/><ellipse cx="22" cy="32" rx="7" ry="13" fill="var(--accent)"/><ellipse cx="50" cy="32" rx="7" ry="13" fill="var(--accent)"/><circle cx="36" cy="38" r="15" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/><circle cx="31" cy="35" r="2.5" fill="var(--accent)"/><circle cx="41" cy="35" r="2.5" fill="var(--accent)"/><ellipse cx="36" cy="43" rx="4" ry="3" fill="var(--sun)"/></svg>`
};
let CATALOG=null, ST=null;
let S={name:"Alex",pet:"hamster",traits:{},log:[],picks:[],rethink:[],retries:0,auto:true};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getJSON=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json()});

/* ---------- AUDIO: a queue of clips, each tied to the words it reads ---------- */
const audio=new Audio(); audio.preload="auto"; audio.setAttribute("playsinline","");
try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
let queue=[],qi=0,playing=false,current=[],Q=[],limit=Infinity;
const clipUrl=c=>c.startsWith("common/")?`audio/${c}.mp3`:`stories/${ST.id}/audio/${c}.mp3`;
function setPlaying(on){playing=on;document.querySelector(".player")?.classList.toggle("speaking",on);setPlayIcon(on);}
function highlight(k){
  app.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
  if(k==null)return;
  const els=app.querySelectorAll(`[data-q="${k}"]`); els.forEach(e=>e.classList.add("reading"));
  const el=els[0]; if(!el)return;
  const r=el.getBoundingClientRect(), h=window.innerHeight;
  if(r.top<80||r.bottom>h-60) el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function playQueue(list,from=0){queue=list;qi=from;next();}
function next(){ if(qi>=queue.length||(queue===current&&qi>=limit)){setPlaying(false);highlight(null);return;}
  const k=qi++; highlight(queue===current?k:null);
  audio.src=clipUrl(queue[k]); audio.play().then(()=>setPlaying(true)).catch(()=>setPlaying(false)); }
audio.addEventListener("ended",next);
audio.addEventListener("error",()=>{ if(qi<queue.length) next(); else {setPlaying(false);highlight(null);} });
function stop(){audio.pause();queue=[];setPlaying(false);highlight(null);}
function setPlayIcon(on){const b=document.getElementById("play");if(!b)return;
  b.innerHTML=on?`<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>`
  :`<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>`;
  b.setAttribute("aria-label",on?"Pause":"Listen");}
function togglePlay(){
  if(playing){audio.pause();setPlaying(false);}
  else if(queue===current&&audio.currentTime>0&&!audio.ended){audio.play().then(()=>setPlaying(true)).catch(()=>{});}
  else playQueue(current);
}
function mediaInfo(title){ try{ if(!("mediaSession" in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title,artist:"StoryWay Kids",album:ST?fill(ST.title):"StoryWay Kids",artwork:[{src:"icon-512.png",sizes:"512x512",type:"image/png"}]});
  navigator.mediaSession.setActionHandler("play",()=>{audio.play().then(()=>setPlaying(true)).catch(()=>{})});
  navigator.mediaSession.setActionHandler("pause",()=>{audio.pause();setPlaying(false)}); }catch(e){} }
function narrate(title,gate){mediaInfo(title||"StoryWay Kids");stop();current=Q;queue=current;limit=gate??Infinity;if(S.auto)playQueue(current);}
/* building narrated text: each call adds a clip to Q and tags its words with that clip's place */
function q(clip){Q.push(clip);return Q.length-1;}
const sp=o=>{o=V(o);return `<span class="s" data-q="${q(o.a)}">${esc(o.t)}</span>`;};
const at=clip=>`data-q="${q(clip)}"`;
function para(p,cls,clip){ // p: list of sentences, or plain text read by one clip
  p=V(p);
  if(typeof p==="string") return `<p class="${cls||""}"><span class="s" data-q="${q(clip)}">${esc(p)}</span></p>`;
  return `<p class="${cls||""}">${p.map(sp).join(" ")}</p>`;
}
const isQuote=p=>{p=V(p);return (typeof p==="string"?p:p[0].t).startsWith('"');};
// tap any sentence to hear it from there
app.addEventListener("click",e=>{const s=e.target.closest(".s");if(!s||!current.length)return;
  playQueue(current,+s.dataset.q);});

/* ---------- FAVORITE PET: the child picks one, stories fill in its details ---------- */
const PET_ART={
 hamster:(ink)=>`<circle cx="34" cy="38" r="12" fill="#E8B07A" stroke="${ink}" stroke-width="2.5"/><circle cx="86" cy="38" r="12" fill="#E8B07A" stroke="${ink}" stroke-width="2.5"/><circle cx="34" cy="38" r="6" fill="#F4A6A6"/><circle cx="86" cy="38" r="6" fill="#F4A6A6"/>
   <ellipse cx="60" cy="66" rx="40" ry="36" fill="#E8B07A" stroke="${ink}" stroke-width="2.5"/><ellipse cx="60" cy="78" rx="22" ry="18" fill="#FBEBD9"/>`,
 puppy:(ink)=>`<ellipse cx="60" cy="62" rx="36" ry="38" fill="#B87A48" stroke="${ink}" stroke-width="2.5"/>
   <path d="M28 40 Q12 52 18 82 Q30 80 34 58Z" fill="#6E4325" stroke="${ink}" stroke-width="2.5"/><path d="M92 40 Q108 52 102 82 Q90 80 86 58Z" fill="#6E4325" stroke="${ink}" stroke-width="2.5"/>
   <ellipse cx="60" cy="80" rx="20" ry="15" fill="#E9C9A6"/>`,
 kitten:(ink)=>`<path d="M26 50 L30 16 L52 36Z" fill="#9AA3AE" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/><path d="M94 50 L90 16 L68 36Z" fill="#9AA3AE" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 40 L33 25 L44 36Z" fill="#F4A6A6"/><path d="M88 40 L87 25 L76 36Z" fill="#F4A6A6"/>
   <ellipse cx="60" cy="66" rx="38" ry="34" fill="#9AA3AE" stroke="${ink}" stroke-width="2.5"/><ellipse cx="60" cy="80" rx="18" ry="13" fill="#E4E8EC"/>`,
 dinosaur:(ink)=>`<path d="M40 30 L46 16 L52 28 L58 12 L64 28 L70 16 L76 30Z" fill="#E9A72E" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>
   <ellipse cx="60" cy="64" rx="40" ry="36" fill="#6DBB6A" stroke="${ink}" stroke-width="2.5"/><ellipse cx="60" cy="80" rx="26" ry="16" fill="#A9DDA4"/>`
};
function petSVG(kind,mood){
  const ink="#3B2A20", art=(PET_ART[kind]||PET_ART.hamster)(ink), happy=mood!=="sad";
  const nose={puppy:`<ellipse cx="60" cy="72" rx="7" ry="5" fill="${ink}"/>`,dinosaur:`<circle cx="54" cy="74" r="2" fill="${ink}"/><circle cx="66" cy="74" r="2" fill="${ink}"/>`}[kind]||`<path d="M55 71 L65 71 L60 77Z" fill="#E77A8A"/>`;
  const whiskers=(kind==="hamster"||kind==="kitten")?`<path d="M36 76 L50 78 M36 84 L50 81 M84 76 L70 78 M84 84 L70 81" stroke="${ink}" stroke-width="1.8" stroke-linecap="round"/>`:"";
  const mouth=happy?`<path d="M52 82 Q60 90 68 82" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`:`<path d="M52 88 Q60 81 68 88" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`;
  const tongue=kind==="puppy"&&happy?`<path d="M56 85 Q60 96 64 85Z" fill="#E77A8A"/>`:"";
  return `<svg viewBox="0 0 120 120" role="img" aria-hidden="true">${art}<circle cx="47" cy="58" r="5" fill="${ink}"/><circle cx="73" cy="58" r="5" fill="${ink}"/><circle cx="49" cy="56" r="1.6" fill="#fff"/><circle cx="75" cy="56" r="1.6" fill="#fff"/>${nose}${whiskers}${mouth}${tongue}</svg>`;
}
function loadPrefs(){ try{ const p=JSON.parse(localStorage.getItem("storyway-prefs")||"{}"); if(p.name)S.name=p.name; if(p.pet)S.pet=p.pet; }catch(e){} }
function savePrefs(){ try{ localStorage.setItem("storyway-prefs",JSON.stringify({name:S.name,pet:S.pet})); }catch(e){} }
const curPet=()=>(ST&&ST.pets&&ST.pets[S.pet])?S.pet:(ST&&ST.petDefault)||S.pet;
const V=x=>x&&x.v?(x.v[curPet()]||Object.values(x.v)[0]):x;
function fill(t,pets){ const P=(pets||(ST&&ST.pets)||{})[pets?S.pet:curPet()]; if(!P||!t)return t; return t.replace(/\{(\w+)\}/g,(m,k)=>P[k]??m); }

/* ---------- FACES: one drawing style, a look per character, a set of expressions ---------- */
const LOOKS={
  leo:{skin:"#C68A5C",hair:"#2B1B12",style:"curly"},
  rivera:{skin:"#E3B48A",hair:"#5A2E1A",style:"bun",glasses:true},
  maya:{skin:"#F2CFA8",hair:"#C2742E",style:"pigtails"},
  kim:{skin:"#EBC49B",hair:"#5B5B5B",style:"short",mustache:true},
  you:{skin:"#D9A07A",hair:"#4A3020",style:"cap"}
};
const MOODS={ // word shown under the face, and how each feature is drawn
  happy:{word:"happy",brow:"up",eyes:"dot",mouth:"grin",cheeks:true},
  relieved:{word:"relieved",brow:"soft",eyes:"closed",mouth:"smile",cheeks:true},
  calm:{word:"calm",brow:"flat",eyes:"dot",mouth:"smile"},
  sad:{word:"sad",brow:"sad",eyes:"dot",mouth:"frown"},
  crying:{word:"sad",brow:"sad",eyes:"dot",mouth:"frown",tears:true},
  worried:{word:"worried",brow:"sad",eyes:"dot",mouth:"wavy",sweat:true},
  scared:{word:"worried",brow:"sadStrong",eyes:"wide",mouth:"wavy",sweat:true},
  distressed:{word:"upset",brow:"sadStrong",eyes:"wide",mouth:"open",tears:true},
  surprised:{word:"surprised",brow:"high",eyes:"wide",mouth:"o"}
};
function faceSVG(who,mood){
  if(who==="pet") return petSVG(curPet(),mood);
  const L=LOOKS[who]||LOOKS.you, M=MOODS[mood]||MOODS.calm, ink="#3B2A20";
  const back={
    bun:`<circle cx="60" cy="20" r="14" fill="${L.hair}"/>`,
    pigtails:`<circle cx="18" cy="56" r="13" fill="${L.hair}"/><circle cx="102" cy="56" r="13" fill="${L.hair}"/>`
  }[L.style]||"";
  const front={
    curly:[30,42,54,66,78,90].map((x,i)=>`<circle cx="${x}" cy="${i%2?26:30}" r="11" fill="${L.hair}"/>`).join("")+`<circle cx="24" cy="44" r="9" fill="${L.hair}"/><circle cx="96" cy="44" r="9" fill="${L.hair}"/>`,
    bun:`<path d="M22 58 Q22 22 60 24 Q98 22 98 58 Q90 38 60 36 Q30 38 22 58Z" fill="${L.hair}"/>`,
    pigtails:`<path d="M22 54 Q24 22 60 24 Q96 22 98 54 Q84 34 62 40 Q44 34 22 54Z" fill="${L.hair}"/>`,
    short:`<path d="M24 50 Q26 24 60 24 Q94 24 96 50 Q80 36 60 36 Q40 36 24 50Z" fill="${L.hair}"/>`,
    cap:`<path d="M24 50 Q26 20 60 20 Q94 20 96 50Z" fill="var(--accent)"/><path d="M60 46 Q92 44 112 52 Q92 56 60 52Z" fill="var(--accent)"/><circle cx="60" cy="21" r="4" fill="var(--sun)"/>`
  }[L.style]||"";
  const brows={
    flat:[[40,50,52,50],[68,50,80,50]], up:[[40,48,52,46],[68,46,80,48]], soft:[[40,50,52,47],[68,47,80,50]],
    sad:[[40,50,52,45],[68,45,80,50]], sadStrong:[[40,51,52,42],[68,42,80,51]], high:[[40,42,52,40],[68,40,80,42]]
  }[M.brow].map(([a,b,c,d])=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`).join("");
  const eyes={
    dot:`<circle cx="46" cy="62" r="4.5" fill="${ink}"/><circle cx="74" cy="62" r="4.5" fill="${ink}"/>`,
    closed:`<path d="M40 63 Q46 57 52 63 M68 63 Q74 57 80 63" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`,
    wide:`<circle cx="46" cy="62" r="7.5" fill="#fff" stroke="${ink}" stroke-width="2"/><circle cx="74" cy="62" r="7.5" fill="#fff" stroke="${ink}" stroke-width="2"/><circle cx="46" cy="63" r="3.5" fill="${ink}"/><circle cx="74" cy="63" r="3.5" fill="${ink}"/>`
  }[M.eyes];
  const mouth={
    grin:`<path d="M44 80 Q60 98 76 80 Z" fill="#8E3B3B" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/>`,
    smile:`<path d="M47 82 Q60 92 73 82" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`,
    frown:`<path d="M47 90 Q60 79 73 90" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`,
    wavy:`<path d="M46 86 Q51 81 56 86 T66 86 T76 86" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linecap="round"/>`,
    open:`<ellipse cx="60" cy="88" rx="9" ry="7" fill="#8E3B3B" stroke="${ink}" stroke-width="3"/>`,
    o:`<ellipse cx="60" cy="86" rx="6" ry="7.5" fill="#8E3B3B" stroke="${ink}" stroke-width="3"/>`
  }[M.mouth];
  const extra=(M.cheeks?`<circle cx="36" cy="76" r="6" fill="#F08A8A" opacity=".45"/><circle cx="84" cy="76" r="6" fill="#F08A8A" opacity=".45"/>`:"")
    +(M.tears?`<path d="M44 70 Q40 80 44 84 Q48 80 44 70Z" fill="#6BB5E8"/><path d="M76 70 Q72 80 76 84 Q80 80 76 70Z" fill="#6BB5E8"/>`:"")
    +(M.sweat?`<path d="M92 40 Q87 50 92 54 Q97 50 92 40Z" fill="#6BB5E8"/>`:"")
    +(L.glasses?`<circle cx="46" cy="62" r="10" fill="none" stroke="${ink}" stroke-width="2.5"/><circle cx="74" cy="62" r="10" fill="none" stroke="${ink}" stroke-width="2.5"/><line x1="56" y1="62" x2="64" y2="62" stroke="${ink}" stroke-width="2.5"/>`:"")
    +(L.mustache?`<path d="M48 77 Q54 72 60 76 Q66 72 72 77 Q66 79 60 78 Q54 79 48 77Z" fill="${L.hair}"/>`:"");
  return `<svg viewBox="0 0 120 120" role="img" aria-hidden="true">${back}
    <circle cx="22" cy="66" r="6" fill="${L.skin}" stroke="${ink}" stroke-width="2.5"/><circle cx="98" cy="66" r="6" fill="${L.skin}" stroke="${ink}" stroke-width="2.5"/>
    <circle cx="60" cy="64" r="38" fill="${L.skin}" stroke="${ink}" stroke-width="2.5"/>
    ${front}${brows}${eyes}${mouth}${extra}</svg>`;
}
function feelLine(who,mood){
  if(who==="pet"){ const P=ST&&ST.pets&&ST.pets[curPet()]; return `${P?P.Name:"Your pet"} feels ${(MOODS[mood]||MOODS.calm).word}`; }
  const c=(ST&&ST.cast&&ST.cast[who])||{name:who,pron:"they"}, w=(MOODS[mood]||MOODS.calm).word;
  return who==="you"?`You feel ${w}`:`${c.name} feels ${w}`;
}
const faceFig=(f,size,noCaption)=>f?`<figure class="face ${size||""}">${faceSVG(f.who,f.mood)}${noCaption?"":`<figcaption>${esc(feelLine(f.who,f.mood))}</figcaption>`}</figure>`:"";
const faceRow=list=>list&&list.length?`<div class="faces">${list.map(f=>faceFig(f)).join("")}</div>`:"";

/* ---------- HOME / STORE ---------- */
async function home(){
  stop();
  if(!CATALOG){ app.innerHTML=`<p class="loading">Loading stories…</p>`;
    try{CATALOG=await getJSON("catalog.json");}catch(e){app.innerHTML=`<p class="loading">Couldn't load the story list. Check your connection and reload.</p>`;return;} }
  app.innerHTML=`
  <div class="eyebrow">Listen · Choose · Grow</div>
  <h1>Story<span>Way</span> Kids</h1>
  <p class="lede">Story adventures you listen to and steer. Every choice shows something about who you are, and when a choice goes wrong, you can learn why and try again.</p>
  <div class="card prefs">
   <div class="field"><label for="nm">What's your name, hero?</label>
    <input id="nm" maxlength="16" value="${esc(S.name)}" autocomplete="off"></div>
   <div class="field"><span class="flabel" id="petlbl">Pick your favorite animal</span>
    <div class="pets" role="radiogroup" aria-labelledby="petlbl">${Object.entries(CATALOG.pets||{}).map(([k,p])=>`<button class="pet ${k===S.pet?"on":""}" role="radio" aria-checked="${k===S.pet}" data-p="${k}">${petSVG(k)}<span>${esc(p.label)}</span></button>`).join("")}</div></div>
  </div>
  <div class="eyebrow">Your stories</div>
  <div class="stories">${CATALOG.stories.filter(s=>s.owned).map(card).join("")}</div>
  <div class="eyebrow">More stories</div>
  <div class="stories">${CATALOG.stories.filter(s=>!s.owned).map(card).join("")}</div>
  <div id="store" hidden></div>
  <p class="soon">Turn your sound on for narration.</p>`;
  app.querySelectorAll(".pet").forEach(b=>b.onclick=()=>{
    S.pet=b.dataset.p; S.name=(document.getElementById("nm").value.trim()||"Alex").slice(0,16); savePrefs(); home();
  });
  app.querySelectorAll(".story-pick").forEach(b=>b.onclick=()=>{
    S.name=(document.getElementById("nm").value.trim()||"Alex").slice(0,16); savePrefs();
    const item=CATALOG.stories.find(x=>x.id===b.dataset.k);
    if(item.owned) begin(item.id); else showStore(item);
  });
}
function card(s){
  return `<button class="story-pick ${s.owned?"":"locked"}" data-k="${s.id}">${ICONS[s.icon]||ICONS.detective}
   <div><span class="eyebrow">${esc(s.kind)}</span><h3>${esc(fill(s.title,CATALOG.pets))}</h3><small>${esc(s.age)}</small>
   ${s.owned?"":`<span class="price">${esc(s.price)}</span>`}</div></button>`;
}
function showStore(item){
  const el=document.getElementById("store");
  el.hidden=false; el.className="store";
  el.innerHTML=`<h3>${esc(fill(item.title,CATALOG.pets))}</h3><p>${esc(item.blurb||"")}</p>
   <button class="primary" id="buy">Unlock for ${esc(item.price)}</button>
   <p class="note" id="buymsg"></p>`;
  document.getElementById("buy").onclick=()=>{document.getElementById("buymsg").textContent="Purchases aren't set up in this prototype yet. In the real app, this button opens the App Store purchase, then downloads the story to your phone.";};
  el.scrollIntoView({behavior:"smooth",block:"center"});
}

/* ---------- STORY ---------- */
async function begin(id){
  app.innerHTML=`<p class="loading">Opening your story…</p>`;
  // start audio inside the tap so iPhone allows narration
  try{audio.src="audio/common/recap_intro.mp3";audio.muted=true;audio.play().then(()=>{audio.pause();audio.muted=false}).catch(()=>{audio.muted=false})}catch(e){}
  try{ ST=await getJSON(`stories/${id}/story.json`); }catch(e){ app.innerHTML=`<p class="loading">Couldn't open that story. Check your connection and try again.</p>`; return; }
  S.traits=Object.fromEntries(ST.traits.map(t=>[t,0])); S.log=[]; S.picks=[]; S.rethink=[]; S.retries=0; S.feelRight=0;
  go(ST.start);
}
function topBar(){return`<div class="top"><button class="link" id="back">← Stories</button><span class="chap" id="chap"></span></div>`;}
function player(){return `<div class="player"><button class="play" id="play" aria-label="Listen"></button>
   <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
   <label class="auto"><input type="checkbox" id="auto" ${S.auto?"checked":""}> Auto-play</label></div>`;}
function wire(chap){
  document.getElementById("chap").textContent=fill(chap);
  setPlayIcon(playing);
  document.getElementById("play").onclick=togglePlay;
  document.getElementById("auto").onchange=e=>{S.auto=e.target.checked;if(!S.auto)stop();};
  document.getElementById("back").onclick=home;
  window.scrollTo({top:0});
}
function apply(c){ for(const[t,v]of Object.entries(c.tr||{}))S.traits[t]=(S.traits[t]||0)+v; S.log.push(fill(c.log)); S.picks.push(c.id); }
function go(id){
  if(id==="end")return ending();
  const n=ST.nodes[id];
  if(n.recap)return recap(n.to);
  Q=[];
  const intro=(id===ST.start&&ST.startSay)?(q(V(ST.startSay).a),""):"";
  const plain=typeof n.text[0]==="string";
  const body=plain?`<div class="text" ${at("n_"+id)}>${n.text.map(p=>`<p class="${isQuote(p)?"say":""}">${esc(p)}</p>`).join("")}</div>`
    :`<div class="text">${n.text.map(p=>para(p,isQuote(p)?"say":"")).join("")}</div>`;
  const f=n.feel;
  let feel="", gate=null, whyAt=null;
  if(f){
    const qi=q(f.qSay.a); gate=qi+1;
    whyAt=Q.length;
    feel=`<div class="feel" id="feel"><div class="row">${faceFig({who:f.who,mood:f.mood},"big",true)}
      <div><div class="eyebrow">Feelings check</div><div class="q"><span class="s" data-q="${qi}">${esc(f.q)}</span></div></div></div>
      <div class="opts">${f.options.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
      <div class="why" id="why" hidden>${para(f.why)}</div></div>`;
  }
  const ask=n.ask?`<div class="eyebrow" ${at(n.ask.a)}>What will you do?</div>`:`<div class="eyebrow">What will you do?</div>`;
  const choices=`<div class="choices">${n.choices.map((c,i)=>`<button class="choice" data-i="${i}" ${c.say?at(V(c.say).a):""}><b>${i+1}</b><span>${esc(fill(c.t))}</span></button>`).join("")}</div>`;
  app.innerHTML=`${topBar()}${player()}${intro}${f?"":faceRow(n.faces)}${body}${feel}<div id="decide" ${f?"hidden":""}>${ask}${choices}</div>`;
  wire(n.ch);
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const c=n.choices[+b.dataset.i];
    if(c.weak) return oops(id,n,c);
    apply(c);
    if(c.lesson) return lesson(n,c);
    go(c.to);
  });
  if(f){
    app.querySelectorAll(".feel .opts button").forEach(b=>b.onclick=()=>{
      if(b.dataset.o===f.answer){
        b.classList.add("right"); app.querySelectorAll(".feel .opts button").forEach(x=>x.disabled=true);
        document.getElementById("why").hidden=false; document.getElementById("decide").hidden=false;
        limit=Infinity; S.feelRight=(S.feelRight||0)+1;
        playQueue(current,whyAt);
      } else {
        b.classList.add("wrong"); b.disabled=true;
        audio.pause(); queue=[ST.lookAgainSay.a]; qi=0; next();
      }
    });
  }
  narrate(n.ch,gate);
}
function gains(c){return Object.entries(c.tr||{}).filter(([,v])=>v>0).map(([t,v])=>`+${v} ${t}`).join(" · ");}
function lesson(n,c){
  Q=[];
  const L=c.lesson, sentenced=typeof L.text!=="string";
  app.innerHTML=`${topBar()}${player()}
   <div class="moment">
    <div class="eyebrow">What your choice shows</div>
    <div class="lesson with-face">${faceFig(c.face)}<div style="display:flex;flex-direction:column;gap:10px"><span class="tag" ${sentenced?at(L.tagSay.a):""}>${esc(L.trait)}</span>${para(L.text,"","l_"+c.id)}
     <p class="note">${esc(gains(c))}</p></div></div>
    <button class="primary" id="cont" ${ST.keepSay?at(ST.keepSay.a):""}>Keep going →</button></div>`;
  wire(n.ch);
  document.getElementById("cont").onclick=()=>go(c.to);
  narrate(L.trait);
}
function oops(id,n,c){
  Q=[];
  const sentenced=typeof c.think!=="string";
  const cons=sentenced?c.consequence.map(p=>para(p)).join(""):`<p>${esc(c.consequence)}</p>`;
  app.innerHTML=`${topBar()}${player()}
   <div class="moment">
    <div class="with-face">${faceFig(c.face,"big")}<div class="text" ${sentenced?"":at("w_"+c.id)}>${cons}</div></div>
    <div class="oops"><span class="tag" ${sentenced?at(ST.thinkSay.a):""}>Let's think about that</span>${sentenced?para(c.think):`<p>${esc(c.think)}</p>`}
     <p class="note">Missed chance to show ${esc(c.missed)}</p></div>
    <div class="btns" ${sentenced?at(ST.retrySay.a):""}>
     <button class="primary" id="retry">↺ Try that moment again</button>
     <button class="retry" id="cont">Keep going with this choice</button></div></div>`;
  wire(n.ch);
  document.getElementById("retry").onclick=()=>{S.retries++;go(id);};
  document.getElementById("cont").onclick=()=>{apply(c);S.rethink.push(c);go(c.to);};
  narrate("Let's think about that");
}
const plainText=x=>{x=V(x);return typeof x==="string"?x:x.map(o=>V(o).t).join(" ");};
function ranked(){return ST.traits.map(t=>[t,S.traits[t]]).sort((a,b)=>b[1]-a[1]);}
function traitBars(){
  const max=Math.max(4,...Object.values(S.traits));
  return `<div class="traits">${ST.traits.map(t=>{const v=Math.max(0,S.traits[t]);
    return `<div class="trait"><span>${t}</span><div class="bar"><span style="width:${v/max*100}%"></span></div><span>${v}</span></div>`}).join("")}</div>`;
}
const storySoFar=()=>`<ol class="log">${S.log.map(l=>`<li>${esc(l)}</li>`).join("")}</ol>`;
function recap(nextId){
  Q=[];
  const t=ranked()[0][0];
  app.innerHTML=`${topBar()}${player()}
   <div class="eyebrow" ${at("common/recap_intro")}>Who you're becoming</div>
   <h2 ${at("g_"+t)}>${esc(S.name)}, you're growing in <span style="color:var(--accent)">${t}</span></h2>
   <p class="lede"><span class="s" ${at("b_"+t)}>${esc(ST.bio[t])}</span></p>
   <div class="card">${traitBars()}</div>
   <h3>Your story so far</h3>${storySoFar()}
   <button class="primary" id="next" ${at("common/recap_outro")}>Keep going →</button>`;
  wire("Checkpoint");
  document.getElementById("next").onclick=()=>go(nextId);
  narrate("Checkpoint");
}
function endingParts(){ return ST.endings.map(g=>g.find(e=>!e.if||S.picks.includes(e.if))); }
function ending(){
  Q=[];
  const r=ranked(),t1=r[0][0],t2=r[1][0],parts=endingParts();
  const shown=r.filter(([,v])=>v>0).slice(0,3);
  app.innerHTML=`${topBar()}${player()}
   ${faceRow(ST.endFaces)}
   <div class="text">${parts.map(e=>para(e.text,"","e_"+e.id)).join("")}</div>
   <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="eyebrow">Who ${esc(S.name)} became</div>
    <div><span class="badge" ${at("t_"+t1)}>${esc(ST.endTitle[t1])}</span></div>
    <p><span class="s" ${at("b_"+t1)}>${esc(ST.bio[t1])}</span> <span class="s" ${at("b_"+t2)}>${esc(ST.bio[t2])}</span></p>
    ${traitBars()}
   </div>
   <h2>What I learned</h2>
   <ul class="learned">
    ${shown.map(([t])=>`<li><strong>${t}:</strong> ${esc(ST.bio[t])}</li>`).join("")}
    ${S.rethink.map(c=>`<li><strong>A moment to rethink:</strong> ${esc(fill(c.log))}. ${esc(plainText(c.think))}</li>`).join("")}
    ${S.feelRight?`<li><strong>Feelings detective:</strong> you read how someone felt ${S.feelRight} time${S.feelRight>1?"s":""} by looking at their face.</li>`:""}
    ${S.retries?`<li><strong>You tried again ${S.retries} time${S.retries>1?"s":""}.</strong> Going back and making a better choice is exactly how people grow.</li>`:""}
   </ul>
   ${ST.talk?`<div class="talk"><div class="eyebrow">For grown-ups · Talk about it</div><ol>${ST.talk.map(t=>`<li>${esc(fill(t))}</li>`).join("")}</ol></div>`:""}
   <h3>Your path</h3>${storySoFar()}
   <div class="choices">
    <button class="primary" id="again" ${at("common/the_end")}>Play again and choose differently</button>
    <button class="choice" id="other"><b>↺</b><span>Pick another story</span></button>
   </div>`;
  wire("The End");
  document.getElementById("again").onclick=()=>begin(ST.id);
  document.getElementById("other").onclick=home;
  narrate("The End");
}
let tt;
function showToast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1600);}
loadPrefs();
home();
try{ if(window.top===window && location.protocol==="https:" && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
</script>
