<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="StoryWay">
<meta name="theme-color" content="#E8F2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131A26" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>StoryWay Kids</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow storybook column; cover → story pages → checkpoint recap → ending */
:root{
  --bg:#E8F2EF; --card:#FFFFFF; --ink:#1E2A3A; --muted:#5A6878;
  --accent:#6A3FA0; --accent-soft:#EFE7FA; --sun:#E9A72E; --line:#D3E2DD;
  --good:#2E8B5A; --bad:#B4483B;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131A26; --card:#1D2637; --ink:#EDF1F7; --muted:#A0ACBC;
  --accent:#B89BF0; --accent-soft:#2A2343; --sun:#F3C25A; --line:#2C3649;
  --good:#5CC48D; --bad:#E7887B; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131A26; --card:#1D2637; --ink:#EDF1F7; --muted:#A0ACBC;
  --accent:#B89BF0; --accent-soft:#2A2343; --sun:#F3C25A; --line:#2C3649;
  --good:#5CC48D; --bad:#E7887B; color-scheme:dark }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
button,label{touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active{transform:scale(.98)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.6rem;font-weight:800;letter-spacing:-.01em}
h1 span{color:var(--accent)}
h2{font-size:1.7rem;font-weight:800}
h3{font-size:1.2rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:52ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input{font:inherit;font-size:max(16px,1.1rem);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.stories{display:grid;gap:14px}
.story-pick{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;transition:transform .15s,border-color .15s}
.story-pick:hover{border-color:var(--accent);transform:translateY(-2px)}
.story-pick svg{width:72px;height:72px}
.story-pick div{display:flex;flex-direction:column;gap:4px;min-width:0}
.story-pick small{color:var(--muted);font-weight:600}
.soon{font-size:.9rem;color:var(--muted);text-align:center}
/* story page */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0}
.chap{font-family:var(--display);font-weight:600;color:var(--accent)}
.player{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:999px;padding:8px 16px 8px 8px}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--card);display:grid;place-items:center;flex:none}
.play svg{width:22px;height:22px}
.wave{display:flex;gap:4px;align-items:center;height:26px;flex:1}
.wave i{display:block;width:5px;height:6px;border-radius:3px;background:var(--accent);opacity:.45}
.speaking .wave i{animation:bob 1s ease-in-out infinite;opacity:.9}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}.wave i:nth-child(6){animation-delay:.5s}.wave i:nth-child(7){animation-delay:.6s}
@keyframes bob{50%{height:24px}}
.auto{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.auto input{width:18px;height:18px;accent-color:var(--accent)}
.text{font-size:1.2rem;line-height:1.65;display:flex;flex-direction:column;gap:14px}
.text p.say{border-left:4px solid var(--sun);padding-left:12px;font-style:italic}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-weight:700;font-size:1.05rem}
.choice:hover{border-color:var(--accent)}
.choice b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display)}
.primary{background:var(--accent);color:var(--card);border:0;border-radius:16px;padding:14px 20px;font-weight:800;font-size:1.1rem}
/* recap */
.badge{display:inline-block;background:var(--sun);color:#1E2A3A;font-family:var(--display);font-weight:800;padding:4px 14px;border-radius:999px;font-size:1rem}
.traits{display:grid;gap:10px}
.trait{display:grid;grid-template-columns:96px 1fr 26px;gap:10px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .6s}
.log{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.log li strong{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-family:var(--display);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.note{font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* lessons + store */
.moment{display:flex;flex-direction:column;gap:16px}
.lesson{background:var(--accent-soft);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.lesson .tag{align-self:flex-start;background:var(--accent);color:var(--card);font-family:var(--display);font-weight:800;padding:2px 14px;border-radius:999px;font-size:1.05rem}
.lesson p{font-size:1.15rem;line-height:1.6}
.oops{background:var(--card);border:2px dashed var(--bad);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px}
.oops .tag{align-self:flex-start;color:var(--bad);font-weight:800;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
.oops p{font-size:1.15rem;line-height:1.6}
.retry{background:var(--card);color:var(--accent);border:2px solid var(--accent);border-radius:16px;padding:14px 20px;font-weight:800;font-size:1.1rem}
.btns{display:flex;flex-direction:column;gap:10px}
.story-pick.locked{border-style:dashed}
.story-pick .price{align-self:flex-start;margin-top:4px;background:var(--sun);color:#1E2A3A;font-weight:800;font-size:.85rem;padding:2px 10px;border-radius:999px}
.store{background:var(--card);border:2px solid var(--sun);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.learned{display:flex;flex-direction:column;gap:10px}
.learned li{line-height:1.5}
.talk{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.talk ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.loading{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>


<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script>
const ICONS={
 detective:`<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--accent-soft)"/><circle cx="31" cy="31" r="13" fill="none" stroke="var(--accent)" stroke-width="5"/><line x1="40" y1="40" x2="54" y2="54" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/><circle cx="27" cy="27" r="3" fill="var(--sun)"/></svg>`,
 athlete:`<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--accent-soft)"/><circle cx="36" cy="36" r="18" fill="var(--card)" stroke="var(--accent)" stroke-width="4"/><polygon points="36,28 43,33 40,41 32,41 29,33" fill="var(--accent)"/><circle cx="56" cy="16" r="4" fill="var(--sun)"/></svg>`,
 puppy:`<svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="var(--accent-soft)"/><ellipse cx="22" cy="32" rx="7" ry="13" fill="var(--accent)"/><ellipse cx="50" cy="32" rx="7" ry="13" fill="var(--accent)"/><circle cx="36" cy="38" r="15" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/><circle cx="31" cy="35" r="2.5" fill="var(--accent)"/><circle cx="41" cy="35" r="2.5" fill="var(--accent)"/><ellipse cx="36" cy="43" rx="4" ry="3" fill="var(--sun)"/></svg>`
};
let CATALOG=null, ST=null;
let S={name:"Alex",traits:{},log:[],picks:[],rethink:[],retries:0,auto:true};
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getJSON=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json()});

/* ---------- AUDIO ---------- */
const audio=new Audio(); audio.preload="auto"; audio.setAttribute("playsinline","");
try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
let queue=[],qi=0,playing=false,current=[];
const clipUrl=c=>c.startsWith("common/")?`audio/${c}.mp3`:`stories/${ST.id}/audio/${c}.mp3`;
function setPlaying(on){playing=on;document.querySelector(".player")?.classList.toggle("speaking",on);setPlayIcon(on);}
function playQueue(list){queue=list;qi=0;next();}
function next(){ if(qi>=queue.length){setPlaying(false);return;}
  audio.src=clipUrl(queue[qi++]); audio.play().then(()=>setPlaying(true)).catch(()=>setPlaying(false)); }
audio.addEventListener("ended",next);
audio.addEventListener("error",()=>{ if(qi<queue.length) next(); else setPlaying(false); });
function stop(){audio.pause();queue=[];setPlaying(false);}
function setPlayIcon(on){const b=document.getElementById("play");if(!b)return;
  b.innerHTML=on?`<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>`
  :`<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>`;
  b.setAttribute("aria-label",on?"Pause":"Listen");}
function togglePlay(){
  if(playing){audio.pause();setPlaying(false);}
  else if(queue===current&&audio.currentTime>0&&!audio.ended){audio.play().then(()=>setPlaying(true)).catch(()=>{});}
  else playQueue(current);
}
function mediaInfo(title){ try{ if(!("mediaSession" in navigator))return;
  navigator.mediaSession.metadata=new MediaMetadata({title,artist:"StoryWay Kids",album:ST?ST.title:"StoryWay Kids",artwork:[{src:"icon-512.png",sizes:"512x512",type:"image/png"}]});
  navigator.mediaSession.setActionHandler("play",()=>{audio.play().then(()=>setPlaying(true)).catch(()=>{})});
  navigator.mediaSession.setActionHandler("pause",()=>{audio.pause();setPlaying(false)}); }catch(e){} }
function narrate(list,title){mediaInfo(title||"StoryWay Kids");current=list;stop();queue=current;if(S.auto)playQueue(list);}

/* ---------- HOME / STORE ---------- */
async function home(){
  stop();
  if(!CATALOG){ app.innerHTML=`<p class="loading">Loading stories…</p>`;
    try{CATALOG=await getJSON("catalog.json");}catch(e){app.innerHTML=`<p class="loading">Couldn't load the story list. Check your connection and reload.</p>`;return;} }
  app.innerHTML=`
  <div class="eyebrow">Listen · Choose · Grow</div>
  <h1>Story<span>Way</span> Kids</h1>
  <p class="lede">Story adventures you listen to and steer. Every choice shows something about who you are, and when a choice goes wrong, you can learn why and try again.</p>
  <div class="card field"><label for="nm">What's your name, hero?</label>
   <input id="nm" maxlength="16" value="${esc(S.name)}" autocomplete="off"></div>
  <div class="eyebrow">Your stories</div>
  <div class="stories">${CATALOG.stories.filter(s=>s.owned).map(card).join("")}</div>
  <div class="eyebrow">More stories</div>
  <div class="stories">${CATALOG.stories.filter(s=>!s.owned).map(card).join("")}</div>
  <div id="store" hidden></div>
  <p class="soon">Turn your sound on for narration.</p>`;
  app.querySelectorAll(".story-pick").forEach(b=>b.onclick=()=>{
    S.name=(document.getElementById("nm").value.trim()||"Alex").slice(0,16);
    const item=CATALOG.stories.find(x=>x.id===b.dataset.k);
    if(item.owned) begin(item.id); else showStore(item);
  });
}
function card(s){
  return `<button class="story-pick ${s.owned?"":"locked"}" data-k="${s.id}">${ICONS[s.icon]||ICONS.detective}
   <div><span class="eyebrow">${esc(s.kind)}</span><h3>${esc(s.title)}</h3><small>${esc(s.age)}</small>
   ${s.owned?"":`<span class="price">${esc(s.price)}</span>`}</div></button>`;
}
function showStore(item){
  const el=document.getElementById("store");
  el.hidden=false; el.className="store";
  el.innerHTML=`<h3>${esc(item.title)}</h3><p>${esc(item.blurb||"")}</p>
   <button class="primary" id="buy">Unlock for ${esc(item.price)}</button>
   <p class="note" id="buymsg"></p>`;
  document.getElementById("buy").onclick=()=>{document.getElementById("buymsg").textContent="Purchases aren't set up in this prototype yet. In the real app, this button opens the App Store purchase, then downloads the story to your phone.";};
  el.scrollIntoView({behavior:"smooth",block:"center"});
}

/* ---------- STORY ---------- */
async function begin(id){
  app.innerHTML=`<p class="loading">Opening your story…</p>`;
  // start audio inside the tap so iPhone allows narration
  try{audio.src="audio/common/recap_intro.mp3";audio.muted=true;audio.play().then(()=>{audio.pause();audio.muted=false}).catch(()=>{audio.muted=false})}catch(e){}
  try{ ST=await getJSON(`stories/${id}/story.json`); }catch(e){ app.innerHTML=`<p class="loading">Couldn't open that story. Check your connection and try again.</p>`; return; }
  S.traits=Object.fromEntries(ST.traits.map(t=>[t,0])); S.log=[]; S.picks=[]; S.rethink=[]; S.retries=0;
  go(ST.start);
}
function topBar(){return`<div class="top"><button class="link" id="back">← Stories</button><span class="chap" id="chap"></span></div>`;}
function player(){return `<div class="player"><button class="play" id="play" aria-label="Listen"></button>
   <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
   <label class="auto"><input type="checkbox" id="auto" ${S.auto?"checked":""}> Auto-play</label></div>`;}
function wire(chap){
  document.getElementById("chap").textContent=chap;
  setPlayIcon(playing);
  document.getElementById("play").onclick=togglePlay;
  document.getElementById("auto").onchange=e=>{S.auto=e.target.checked;if(!S.auto)stop();};
  document.getElementById("back").onclick=home;
  window.scrollTo({top:0});
}
function apply(c){ for(const[t,v]of Object.entries(c.tr||{}))S.traits[t]=(S.traits[t]||0)+v; S.log.push(c.log); S.picks.push(c.id); }
function go(id){
  if(id==="end")return ending();
  const n=ST.nodes[id];
  if(n.recap)return recap(n.to);
  app.innerHTML=`${topBar()}${player()}
   <div class="text">${n.text.map(p=>`<p class="${p.startsWith('"')?'say':''}">${esc(p)}</p>`).join("")}</div>
   <div class="eyebrow">What will you do?</div>
   <div class="choices">${n.choices.map((c,i)=>`<button class="choice" data-i="${i}"><b>${i+1}</b><span>${esc(c.t)}</span></button>`).join("")}</div>`;
  wire(n.ch);
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const c=n.choices[+b.dataset.i];
    if(c.weak) return oops(id,n,c);
    apply(c);
    if(c.lesson) return lesson(n,c);
    go(c.to);
  });
  narrate([`n_${id}`],n.ch);
}
function gains(c){return Object.entries(c.tr||{}).filter(([,v])=>v>0).map(([t,v])=>`+${v} ${t}`).join(" · ");}
function lesson(n,c){
  app.innerHTML=`${topBar()}${player()}
   <div class="moment">
    <div class="eyebrow">What your choice shows</div>
    <div class="lesson"><span class="tag">${esc(c.lesson.trait)}</span><p>${esc(c.lesson.text)}</p>
     <p class="note">${esc(gains(c))}</p></div>
    <button class="primary" id="cont">Keep going →</button></div>`;
  wire(n.ch);
  document.getElementById("cont").onclick=()=>go(c.to);
  narrate([`l_${c.id}`],c.lesson.trait);
}
function oops(id,n,c){
  app.innerHTML=`${topBar()}${player()}
   <div class="moment">
    <div class="text"><p>${esc(c.consequence)}</p></div>
    <div class="oops"><span class="tag">Let's think about that</span><p>${esc(c.think)}</p>
     <p class="note">Missed chance to show ${esc(c.missed)}</p></div>
    <div class="btns">
     <button class="primary" id="retry">↺ Try that moment again</button>
     <button class="retry" id="cont">Keep going with this choice</button></div></div>`;
  wire(n.ch);
  document.getElementById("retry").onclick=()=>{S.retries++;go(id);};
  document.getElementById("cont").onclick=()=>{apply(c);S.rethink.push(c);go(c.to);};
  narrate([`w_${c.id}`],"Let's think about that");
}
function ranked(){return ST.traits.map(t=>[t,S.traits[t]]).sort((a,b)=>b[1]-a[1]);}
function traitBars(){
  const max=Math.max(4,...Object.values(S.traits));
  return `<div class="traits">${ST.traits.map(t=>{const v=Math.max(0,S.traits[t]);
    return `<div class="trait"><span>${t}</span><div class="bar"><span style="width:${v/max*100}%"></span></div><span>${v}</span></div>`}).join("")}</div>`;
}
const storySoFar=()=>`<ol class="log">${S.log.map(l=>`<li>${esc(l)}</li>`).join("")}</ol>`;
function recap(nextId){
  const t=ranked()[0][0];
  app.innerHTML=`${topBar()}${player()}
   <div class="eyebrow">Who you're becoming</div>
   <h2>${esc(S.name)}, you're growing in <span style="color:var(--accent)">${t}</span></h2>
   <p class="lede">${esc(ST.bio[t])}</p>
   <div class="card">${traitBars()}</div>
   <h3>Your story so far</h3>${storySoFar()}
   <button class="primary" id="next">Keep going →</button>`;
  wire("Checkpoint");
  document.getElementById("next").onclick=()=>go(nextId);
  narrate(["common/recap_intro","g_"+t,"b_"+t,"common/recap_outro"],"Checkpoint");
}
function endingParts(){ return ST.endings.map(g=>g.find(e=>!e.if||S.picks.includes(e.if))); }
function ending(){
  const r=ranked(),t1=r[0][0],t2=r[1][0],parts=endingParts();
  const shown=r.filter(([,v])=>v>0).slice(0,3);
  app.innerHTML=`${topBar()}${player()}
   <div class="text">${parts.map(e=>`<p>${esc(e.text)}</p>`).join("")}</div>
   <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="eyebrow">Who ${esc(S.name)} became</div>
    <div><span class="badge">${esc(ST.endTitle[t1])}</span></div>
    <p>${esc(ST.bio[t1])} ${esc(ST.bio[t2])}</p>
    ${traitBars()}
   </div>
   <h2>What I learned</h2>
   <ul class="learned">
    ${shown.map(([t])=>`<li><strong>${t}:</strong> ${esc(ST.bio[t])}</li>`).join("")}
    ${S.rethink.map(c=>`<li><strong>A moment to rethink:</strong> ${esc(c.log)}. ${esc(c.think)}</li>`).join("")}
    ${S.retries?`<li><strong>You tried again ${S.retries} time${S.retries>1?"s":""}.</strong> Going back and making a better choice is exactly how people grow.</li>`:""}
   </ul>
   ${ST.talk?`<div class="talk"><div class="eyebrow">For grown-ups · Talk about it</div><ol>${ST.talk.map(q=>`<li>${esc(q)}</li>`).join("")}</ol></div>`:""}
   <h3>Your path</h3>${storySoFar()}
   <div class="choices">
    <button class="primary" id="again">Play again and choose differently</button>
